[project]
site_name = "model_resolver"
site_description = "A beet plugin that renders Minecraft models, items and structures."
site_url = "https://edayot.github.io/model_resolver/"
extra_css = ["stylesheets/extra.css"]
repo_url = "https://github.com/edayot/model_resolver"
repo_name = "edayot/model_resolver"
copyright = "Copyright &copy; edayot"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/installation.md",
    "getting-started/first-render.md",
  ] },
  { "Guides" = [
    "guides/configuration.md",
    "guides/rendering-items.md",
    "guides/rendering-models.md",
    "guides/rendering-structures.md",
    "guides/animated-textures.md",
    "guides/builtin-plugins.md",
    "guides/ci-cd.md",
  ] },
  { "API reference" = "reference/api.md" },
  { "Credits" = "credits.md" },
]

[project.theme]
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "content.code.copy",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
show_source = false
show_root_heading = true
members_order = "source"
docstring_style = "google"
